<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LH-Digital - Nous contacter">
    <link rel="stylesheet" href="../style.css">
    <link rel="shortcut icon" href="../IMG/LOGO FAVICON.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>LH Digital - Contact</title>
</head>
<body>
    <header>
        <h1>LH DIGITAL</h1>
        <nav class="nav-accueil">
            <ul>
                <li><a href="./index.html">Accueil</a></li>
                <li><a href="./projet.html">Projets</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
        <img src="../IMG/LOGO FAVICON.svg" alt="Logo LH-Digital">
    </header>

    <main>
        <section class="contact">
            <h2>Me Contacter</h2>
            <form class="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="sujet">Sujet</label>
                    <input type="text" id="sujet" name="sujet" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 LH Digital. Tous droits réservés.</p>
    </footer>
</body>
</html>
